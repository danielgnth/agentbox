# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: agentbox agent config
description: >-
  Bot git identity, the co-author commit hook, Claude attribution settings,
  gh as git credential helper, git-ai, and the Claude session mirror for the
  host (Vorssaint).

# Runs after the Claude workload, so git-ai's hook registration lands on top
# of the settings.json the workload rewrites on every create.
requires: ["claude"]

# All values are passed by `agentbox up` via --kit-args-file. None are secret.
args:
  project:
    required: true
    pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
    description: Sandbox name; the repo lives in ~/workspace/<project>
    env: AGENTBOX_PROJECT
  bot_name:
    required: true
    pattern: '^[^\n]+$'
    description: Git author name of the agent (GitHub App bot)
    env: AGENTBOX_BOT_NAME
  bot_email:
    required: true
    pattern: '^[^\s<>]+@[^\s<>]+$'
    description: Git author email of the agent (bot noreply address)
    env: AGENTBOX_BOT_EMAIL
  coauthor:
    required: true
    pattern: '^[^<>\n]+ <[^\s<>]+@[^\s<>]+>$'
    description: Human co-author, "Name <id+login@users.noreply.github.com>"
    env: AGENTBOX_COAUTHOR
  session_dir:
    default: ""
    pattern: '^(/[^\n]*)?$'
    description: Host session folder mounted into the sandbox (empty = no mirror)
    env: AGENTBOX_SESSION_DIR
  git_ai:
    default: "true"
    enum: ["true", "false"]
    description: Install git-ai at create time
    env: AGENTBOX_GIT_AI

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          # git-ai installer and its release downloads
          - usegitai.com
          - github.com
          - api.github.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com
          - raw.githubusercontent.com
      runtime:
        allow:
          # git over HTTPS, gh, PRs
          - github.com
          - api.github.com
          - uploads.github.com
          - codeload.github.com
          - objects.githubusercontent.com
          - release-assets.githubusercontent.com
          - raw.githubusercontent.com
          - usegitai.com
          # VS Code Remote-SSH server and extension downloads
          - update.code.visualstudio.com
          - vscode.download.prss.microsoft.com
          - marketplace.visualstudio.com
          - "*.gallerycdn.vsassets.io"
          - "*.vscode-cdn.net"
          - open-vsx.org

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -eu
            git config --system user.name "$AGENTBOX_BOT_NAME"
            git config --system user.email "$AGENTBOX_BOT_EMAIL"
            git config --system agentbox.botemail "$AGENTBOX_BOT_EMAIL"
            git config --system agentbox.coauthor "$AGENTBOX_COAUTHOR"
            git config --system core.hooksPath /usr/local/share/agentbox/git-hooks
            git config --system init.defaultBranch main
            git config --system push.autoSetupRemote true
            git config --system fetch.prune true
            # gh answers git's credential requests with the GH_TOKEN sentinel;
            # the proxy swaps in the real App token on github.com.
            git config --system --replace-all credential.https://github.com.helper ''
            git config --system --add credential.https://github.com.helper '!/usr/local/bin/gh auth git-credential'
            install -d -o agent -g agent /home/agent/workspace
          user: "0"
          env: [AGENTBOX_BOT_NAME, AGENTBOX_BOT_EMAIL, AGENTBOX_COAUTHOR]
          description: System git config (bot identity, hooks, credential helper)

        - command: |
            set -u
            [ "${AGENTBOX_GIT_AI:-true}" = true ] || exit 0
            export PATH="$HOME/.git-ai/bin:$HOME/.local/bin:$PATH"
            if ! command -v git-ai >/dev/null 2>&1; then
              curl -fsSL https://usegitai.com/install.sh | bash \
                || { echo "agentbox: git-ai install failed (continuing without it)" >&2; exit 0; }
            fi
            git ai install-hooks || echo "agentbox: git-ai install-hooks failed" >&2
            exit 0
          user: agent
          env: [AGENTBOX_GIT_AI, HTTP_PROXY, HTTPS_PROXY, http_proxy, https_proxy, NO_PROXY, no_proxy]
          description: Install git-ai (best effort; never blocks sandbox creation)

      startup:
        # SSH sessions (VS Code) do not inherit the container environment, so
        # give gh a config-file copy of the GH_TOKEN sentinel. It is a
        # placeholder, not a credential: only the host proxy holds the token.
        - command: |
            set -eu
            [ -n "${GH_TOKEN:-}" ] || exit 0
            mkdir -p /home/agent/.config/gh
            umask 077
            printf 'github.com:\n    oauth_token: %s\n    git_protocol: https\n    user: x-access-token\n' \
              "$GH_TOKEN" > /home/agent/.config/gh/hosts.yml
          user: agent
          env: [GH_TOKEN]
          description: Make gh work in SSH sessions (sentinel token only)

        # Mirror this project's Claude sessions to the host: the host folder
        # is mounted at its own absolute path, and Claude's project folder for
        # ~/workspace/<project> becomes a symlink to it.
        - command: |
            set -eu
            dir="${AGENTBOX_SESSION_DIR:-}"
            [ -n "$dir" ] && [ -d "$dir" ] || exit 0
            slug=$(printf '%s' "/home/agent/workspace/$AGENTBOX_PROJECT" | sed 's/[^A-Za-z0-9]/-/g')
            projects=/home/agent/.claude/projects
            link="$projects/$slug"
            mkdir -p "$projects"
            if [ -d "$link" ] && [ ! -L "$link" ]; then
              cp -an "$link"/. "$dir"/ && rm -rf "$link"
            fi
            ln -sfn "$dir" "$link"
            chown -h agent:agent "$link"
          user: "0"
          env: [AGENTBOX_SESSION_DIR, AGENTBOX_PROJECT]
          description: Link Claude's project session folder to the host mount

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./agent-config-context.md
