# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: agentbox cloud tools
description: >-
  gcloud, kubectl, helm, flux, terraform and tflint. Credentials are never
  baked in: `agentbox creds <sandbox>` drops one-hour read-only tokens in.

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - "*.googleapis.com"
          - oauth2.googleapis.com
          - dl.google.com
          - registry.terraform.io
          - releases.hashicorp.com
          - checkpoint-api.hashicorp.com
          - dl.k8s.io
          - get.helm.sh
          - ghcr.io
          - pkg-containers.githubusercontent.com

  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        ## Cloud tools (agentbox)
        - gcloud, kubectl, helm, flux, terraform and tflint are installed.
        - Credentials are short-lived (1 hour) and READ-ONLY. If gcloud or kubectl
          reports an expired or missing token, tell the user to run
          `agentbox creds <sandbox>` on the Mac. Do not try to log in yourself.
        - terraform: only `fmt`, `validate` and `tflint` here. Never `plan`/`apply`.
