# Read-only identity for agent sandboxes. `agentbox creds` mints one-hour
# tokens for this ServiceAccount (kubectl create token --duration=1h).
# The built-in `view` ClusterRole excludes Secrets.
apiVersion: v1
kind: Namespace
metadata:
  name: agent-ro
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-ro
  namespace: agent-ro
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-ro-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: agent-ro
    namespace: agent-ro
